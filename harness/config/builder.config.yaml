# Merge into ~/.hermes/profiles/hustle-builder/config.yaml (install.sh applies these with `hermes config set`).
# Model: the local MLX server. Every profile in the harness uses it; no frontier model is called.
model:
  default: local-large:latest
  provider: openai-compatible
  base_url: http://127.0.0.1:11434/v1

terminal:
  backend: local
  cwd: /Users/hustle/project
  env_passthrough:
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
    - BREVO_API_KEY
    - GITHUB_TOKEN
    - TEST_SIGNUP_EMAIL

approvals:
  mode: off            # the Builder runs unattended; the hardline blocklist stays on regardless
  unattended_mode: approve
  cron_mode: approve
  deny:
    - "git push --force*"
    - "rm -rf ~*"
    - "rm -rf /Users*"
    - "sudo*"
    - "*curl*|*sh*"
    - "launchctl unload*"

kanban:
  notify_in_gateway: false

memory:
  memory_enabled: true
